name: Build PHOENIXA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # ---------- APK for sideloading / Amazon ----------
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PHOENIXA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PHOENIXA-APK
          path: PHOENIXA.apk

      # ---------- App Bundle for Google Play (only when the upload key secrets exist) ----------
      - name: Build Google Play bundle
        id: aab
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "No upload key secrets set - skipping Google Play bundle."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle bundleRelease -PplayStore=true --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab PHOENIXA-play.aab
          rm -f "$RUNNER_TEMP/upload.jks"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.aab.outputs.built == 'true'
        with:
          name: PHOENIXA-GooglePlay-AAB
          path: PHOENIXA-play.aab

      # ---------- Public release (APK only; the .aab stays private in Actions) ----------
      - name: Move the 'latest' tag to this build
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PHOENIXA (latest build)
          body: |
            Latest PHOENIXA builds.

            **Fire TV / Android TV:** download **PHOENIXA.apk** and install it with Downloader (code **4563854**) or any file manager. It installs over older versions and keeps your login and settings.

            **Windows 10 / 11:** download **PHOENIXA-Windows.zip**, unzip it anywhere and run **PHOENIXA.exe** inside the PHOENIXA folder. No installation needed.
          files: PHOENIXA.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- Windows desktop app (portable zip) ----------
  windows:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build Windows app
        run: gradle -p desktop createDistributable --stacktrace

      - name: Add the video engine (libmpv)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "desktop/build/compose/binaries/main/app/PHOENIXA"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }

          # libmpv-2.dll from the mpv Windows builds by shinchiro
          $rel = Invoke-RestMethod -Headers $headers https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like 'mpv-dev-x86_64-*.7z' -and $_.name -notlike '*v3*' } | Select-Object -First 1
          if (-not $asset) { throw "libmpv download not found" }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompvdev -y | Out-Null
          $dll = Get-ChildItem mpvdev -Recurse -Filter 'libmpv-2.dll' | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll missing in $($asset.name)" }
          New-Item -ItemType Directory -Force "$app/mpv" | Out-Null
          Copy-Item $dll.FullName "$app/mpv/libmpv-2.dll"
          Get-ChildItem "$app/mpv"

      - name: Make portable zip
        run: Compress-Archive -Path "desktop/build/compose/binaries/main/app/PHOENIXA" -DestinationPath PHOENIXA-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PHOENIXA-Windows
          path: PHOENIXA-Windows.zip

      - name: Add to latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PHOENIXA (latest build)
          body: |
            Latest PHOENIXA builds.

            **Fire TV / Android TV:** download **PHOENIXA.apk** and install it with Downloader (code **4563854**) or any file manager. It installs over older versions and keeps your login and settings.

            **Windows 10 / 11:** download **PHOENIXA-Windows.zip**, unzip it anywhere and run **PHOENIXA.exe** inside the PHOENIXA folder. No installation needed.
          files: PHOENIXA-Windows.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
