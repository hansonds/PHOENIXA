name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # ---------- APK for sideloading / Amazon ----------
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PHOENIXA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PHOENIXA-APK
          path: PHOENIXA.apk

      # ---------- App Bundle for Google Play (only when the upload key secrets exist) ----------
      - name: Build Google Play bundle
        id: aab
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "No upload key secrets set - skipping Google Play bundle."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle bundleRelease -PplayStore=true --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab PHOENIXA-play.aab
          rm -f "$RUNNER_TEMP/upload.jks"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.aab.outputs.built == 'true'
        with:
          name: PHOENIXA-GooglePlay-AAB
          path: PHOENIXA-play.aab

      # ---------- Public release (APK only; the .aab stays private in Actions) ----------
      - name: Move the 'latest' tag to this build
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PHOENIXA (latest build)
          body: |
            Latest PHOENIXA build for Fire TV and Android TV.
            Download **PHOENIXA.apk** below and install it with Downloader (or any file manager).
            It installs over older versions and keeps your login and settings.
          files: PHOENIXA.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
